<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIGCélulas</title>
  <link rel="icon" type="image/png" href="../imagens/icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playwrite+GB+J:ital,wght@0,100..400;1,100..400&family=Playwrite+GB+S+Guides:ital@0;1&family=Roboto:ital,wght@0,100..900;1,100..900&family=Trispace:wght@100..800&display=swap"
      rel="stylesheet">
  <link rel="stylesheet" href="../css/paginaLoginCadastro.css"> 

  <script src="../javascript/paginaCadastro.js" defer></script>
</head>
<body>
  <div class="conteiner-logo">
    <img class="logo" src="../imagens/logo.png" alt="Logo do Sistema">
  </div>

  <div class="conteiner-pagina">
    <div class="layout-dividido">
      
      <div class="coluna-imagem">
        <img src="../imagens/ilustracao.jpg" alt="Ilustração de boas-vindas" class="ilustracao">
      </div>

      <div class="coluna-formulario">
        <h1 class="texto-boas-vindas">Junte-se a nós!</h1>
        
        <div class="cartao-login">
          <h2 class="titulo-cartao">Cadastre-se</h2>
          
          <form id="cadastroForm">
            
            <div class="envoltorio-entrada">
              <div class="grupo-entrada">
                <svg class="icone" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
                <input type="text" id="nome" placeholder="Digite seu nome completo" required>
              </div>
              <span class="mensagem-erro">Este campo é obrigatório</span>
            </div>

            <div class="envoltorio-entrada">
              <div class="grupo-entrada">
                <svg class="icone" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm6 12H6v-1c0-2 4-3.1 6-3.1s6 1.1 6 3.1v1z"/>
                </svg>
                <input type="text" id="matricula" placeholder="Digite sua matrícula" required minlength="7" maxlength="7">
              </div>
              <span class="mensagem-erro">Este campo é obrigatório</span>
            </div>

            <div class="envoltorio-entrada">
              <div class="grupo-entrada">
                <svg class="icone" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                </svg>
                <input 
                  type="email" 
                  id="email"
                  placeholder="Digite seu melhor email" 
                  required
                  oninvalid="this.setCustomValidity('Por favor, inclua um @ no endereço de e-mail.')"
                  oninput="this.setCustomValidity('')"
                >
              </div>
              <span class="mensagem-erro">Este campo é obrigatório</span>
            </div>

            <div class="envoltorio-entrada">
              <div class="grupo-entrada">
                <svg class="icone" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm9 14H6V10h12v10zm-6-3c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/>
                </svg>
                <input type="password" id="senha" placeholder="Crie uma senha" minlength="6" maxlength="8" required>
              </div>
              <span class="mensagem-erro">Este campo é obrigatório</span>
            </div>

            <div class="envoltorio-entrada">
              <div class="grupo-entrada">
                <svg class="icone" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm9 14H6V10h12v10zm-6-3c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/>
                </svg>
                <input type="password" id="confirmarSenha" placeholder="Confirme sua senha" minlength="6" maxlength="8" required>
              </div>
              <span class="mensagem-erro">Este campo é obrigatório</span>
            </div>

            <div class="conteiner-links">
              <p>Já tem uma conta? <a href="paginaLogin.html">Faça login aqui.</a></p>
            </div>

            <button type="submit" class="botao-enviar" >CADASTRAR</button>
          </form>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
